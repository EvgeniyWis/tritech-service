# /etc/nginx/sites-available/tritech — ТрайтэкСервис (PHP-FPM)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/tritech/public;
    index index.php;
    client_max_body_size 12m;

    # статика
    location /assets/ {
        expires 1h;
        try_files $uri =404;
    }

    # всё остальное (API и SPA) — единая точка входа
    location / {
        try_files $uri @app;
    }

    location @app {
        rewrite ^ /index.php last;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_read_timeout 60s;
    }

    # прочие .php напрямую не исполняются
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}
